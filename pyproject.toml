[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bunnybyte-agent"
dynamic = ["version"]
description = "BunnyByte, a local coding agent for OpenAI-compatible, Anthropic-compatible, and DeepSeek models"
readme = "README.EN.md"
requires-python = ">=3.10"
authors = [{ name = "LISAooo1234" }]
keywords = ["coding-agent", "ai", "llm", "terminal", "tui", "deepseek", "claude", "openai", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "textual>=8.2,<9",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/LISAooo1234/Bunny-Byte"
Repository = "https://github.com/LISAooo1234/Bunny-Byte"
Changelog = "https://github.com/LISAooo1234/Bunny-Byte/blob/main/CHANGELOG.md"
Issues = "https://github.com/LISAooo1234/Bunny-Byte/issues"

[project.scripts]
bunny = "bunnybyte.cli:main"
bunnybyte = "bunnybyte.cli:main"
bunnybyte-tui = "bunnybyte.tui.main:main"
bb = "bunnybyte.cli:main"
bbtui = "bunnybyte.tui.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.23",
  "ruff>=0.4.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.23",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["bunnybyte*"]

[tool.setuptools.dynamic]
version = { attr = "bunnybyte.version.__version__" }

[tool.pytest.ini_options]
norecursedirs = [
  ".git",
  ".venv",
  "artifacts",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

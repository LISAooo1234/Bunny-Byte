name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: |
          set +e
          pytest tests/ -q -rfE --tb=short 2>&1 | tee pytest.out
          code=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.out | head -20 | sed 's/^/::error::/'
          exit $code

name: Release

# 推 v* 标签时：构建、用 CI 同一个脚本冒烟、把 sdist + wheel 挂到 GitHub Release。
# 发 PyPI 需要维护者先在 PyPI 配好 trusted publishing，并把仓库变量 PYPI_PUBLISH 设为 true。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check tag matches version
        run: |
          version=$(python -c 'import runpy; print(runpy.run_path("bunnybyte/version.py")["__version__"])')
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || { echo "::error::tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Smoke test the wheel
        run: scripts/smoke_wheel.sh dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 从 CHANGELOG.md 取出这个版本的一节作为发布说明
          awk -v head="## ${GITHUB_REF_NAME#v}" '$0 == head {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "见 CHANGELOG.md" > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
